[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "target-ducklake"
description = "Singer target for DuckLake."
readme = "README.md"
keywords = [ "DuckDB", "DuckLake", "ELT", "singer.io" ]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [
  "version",
]
dependencies = [
  "duckdb>=1.5",
]
[[project.maintainers]]
name = "Edgar Ramírez-Mondragón"
email = "edgarrm358@gmail.com"
[[project.authors]]
name = "Edgar Ramírez-Mondragón"
email = "edgarrm358@gmail.com"
[project.urls]
Homepage = "https://github.com/reservoir-data/target-ducklake"
Repository = "https://github.com/reservoir-data/target-ducklake"
[project.scripts]
target-ducklake = "target_ducklake.cli:main"

[dependency-groups]
dev = [
  { include-group = "testing" },
  { include-group = "typing" },
]
testing = [
  "pytest>=9",
]
typing = [
  "mypy>=2.1",
]

[tool.hatch.version]
source = "vcs"

[tool.pytest]
addopts = ["-ra"]

[tool.ruff]
line-length = 88
[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "COM812", # missing-trailing-comma
  "CPY001", # missing-copyright-notice
  "ISC001", # single-line-implicit-string-concatenation
]
per-file-ignores."target_ducklake/warehouse.py" = [
  "S608", # hardcoded-sql-expression: identifiers and literals are quoted by `sql`
]
per-file-ignores."tests/*" = [
  "ANN401", # any-type
  "PLC0415", # import-outside-top-level
  "PLR2004", # magic-value-comparison
  "ANN201", # missing-return-type-public-function
  "D",      # pydocstyle
  "S101",   # assert
  "S608",   # hardcoded-sql-expression
  "SLF001", # private-member-access
]
pydocstyle.convention = "google"

[tool.mypy]
strict = true
